<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 馬年大吉</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --red-deep: #7a0000;
            --red-bright: #b30000;
            --bg: #111;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; font-family: "Arial", sans-serif; 
        }

        /* 高級背景 */
        .sparkles {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2e0000 0%, #000 100%);
            z-index: -1;
        }
        .sparkles::after {
            content: ""; position: absolute; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3;
        }

        /* 核心容器：確保所有東西絕對居中 */
        .viewport {
            position: relative;
            display: flex; justify-content: center; align-items: center;
            width: 100vw; height: 100vh;
        }

        .scene { 
            position: relative; 
            width: 320px; 
            height: 220px; 
            z-index: 10;
        }

        /* 信封後層 */
        .envelope-back {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background: var(--red-deep);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1;
        }

        /* 賀卡：藏在信封裡 */
        .card {
            position: absolute; 
            top: 50%; left: 50%;
            width: 300px; /* 略小於信封 */
            height: 200px;
            background: #fff;
            z-index: 2; /* 夾在中間 */
            border-radius: 4px;
            overflow: hidden;
            transform: translate(-50%, -50%); /* 初始完全置中隱藏 */
            visibility: hidden;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        /* 信封前口袋：擋住卡片 */
        .envelope-front {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(160deg, var(--red-deep), var(--red-bright));
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0, 50% 55%, 100% 0);
            z-index: 3;
            border-radius: 0 0 8px 8px;
            pointer-events: none;
            border-bottom: 2px solid var(--gold);
        }

        /* 信封上蓋 */
        .flap {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--red-bright);
            clip-path: polygon(0 0, 50% 55%, 100% 0);
            transform-origin: top; 
            z-index: 4;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }

        .guide {
            position: absolute; bottom: 10%; width: 100%; text-align: center;
            color: var(--gold); font-size: 13px; letter-spacing: 1px;
            opacity: 0; z-index: 20; font-weight: bold;
        }
        .guide span { display: block; animation: bounce 1.5s infinite; font-size: 20px; margin-bottom: 5px;}
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* 全螢幕模式樣式 */
        .is-full-view {
            z-index: 100 !important;
        }
    </style>
</head>
<body>

<div class="sparkles"></div>

<div class="viewport">
    <div class="scene" id="scene">
        <div class="flap" id="flap"></div>
        <div class="envelope-back"></div>
        
        <div class="card" id="card">
            <img src="luck.png" alt="馬年大吉">
        </div>

        <div class="envelope-front"></div>
        
        <div class="guide" id="guide">
            <span>▲</span>
            SWIPE UP TO RECEIVE LUCK
        </div>
    </div>
</div>

<script>
    const scene = document.getElementById('scene');
    const flap = document.getElementById('flap');
    const card = document.getElementById('card');
    const guide = document.getElementById('guide');

    window.onload = () => {
        const tl = gsap.timeline();
        
        // 初始：信封在中間，卡片完全隱藏
        gsap.set(scene, { y: 100, opacity: 0 });

        tl.to(scene, { y: 0, opacity: 1, duration: 1, ease: "power3.out" })
          .to(flap, { rotateX: 180, duration: 0.8, ease: "power2.inOut" }) // 1. 打開蓋子
          .set(flap, { zIndex: 0 }) 
          .to(card, { visibility: "visible", y: -60, duration: 0.7, ease: "back.out(1.2)" }) // 2. 探出一小角
          .to(guide, { opacity: 1, duration: 0.5 });
    };

    let startY = 0;
    let isLaunched = false;

    document.addEventListener('touchstart', (e) => startY = e.touches[0].pageY);
    document.addEventListener('touchmove', (e) => {
        if (isLaunched) return;
        let diff = startY - e.touches[0].pageY;
        if (diff > 0 && diff < 100) {
            gsap.set(card, { y: -60 - diff }); // 跟隨手指
        }
    });

    document.addEventListener('touchend', (e) => {
        if (isLaunched) return;
        if (startY - e.changedTouches[0].pageY > 60) {
            launchSeamless();
        } else {
            gsap.to(card, { y: -60, duration: 0.3 });
        }
    });

    function launchSeamless() {
        isLaunched = true;
        const tl = gsap.timeline();

        gsap.to(guide, { opacity: 0, duration: 0.2 });

        // 核心動畫：卡片放大與信封退場同時進行
        tl.to(card, {
            y: 0, // 回到垂直中心點
            scale: 1,
            width: "100vw",
            height: "100vh",
            duration: 1,
            ease: "power2.inOut",
            onStart: () => {
                card.classList.add('is-full-view');
                // 進入全螢幕時切換成 contain 確保手機看得到全圖
                card.querySelector('img').style.objectFit = "contain";
            }
        }, 0)
        .to(scene.querySelectorAll('.envelope-back, .envelope-front, #flap'), {
            opacity: 0,
            scale: 0.8,
            duration: 0.6,
            ease: "power2.in"
        }, 0);
    }
</script>
</body>
</html>
